name: Render NOAA Japan H2 Limited (Sep 2026)

on:
  schedule:
    # JST 09:00 / 14:00, September 7–13 only.
    # The script also checks the year, so it cannot restart next year.
    - cron: '0 0 7-13 9 *'
    - cron: '0 5 7-13 9 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-noaa-japan-h2-limited-202609
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify script and active date
        id: window
        run: |
          test -f scripts/render_forecast_videos_noaa_japan_h2_limited.mjs
          node --check scripts/render_forecast_videos_noaa_japan_h2_limited.mjs
          node scripts/render_forecast_videos_noaa_japan_h2_limited.mjs --check-window

  render:
    needs: gate
    if: needs.gate.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start local SWIFT-TEC server
        run: |
          python3 -m http.server 8000 --directory docs > /tmp/swifttec-http.log 2>&1 &
          echo $! > /tmp/swifttec-http.pid

          sleep 1
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "Local server ready"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/swifttec-http.pid)" 2>/dev/null; then
              cat /tmp/swifttec-http.log || true
              exit 1
            fi
            sleep 1
          done

          cat /tmp/swifttec-http.log || true
          exit 1

      - name: Render limited NOAA Japan horizontal video
        env:
          SWIFTTEC_RENDER_URL: http://127.0.0.1:8000/
          SWIFTTEC_VIDEO_MAX_FRAMES: "600"
          SWIFTTEC_VIDEO_FRAME_DELAY_MS: "80"
          SWIFTTEC_VIDEO_FPS: "10"
          SWIFTTEC_VIDEO_WIDTH: "1700"
          SWIFTTEC_VIDEO_HEIGHT: "900"
          SWIFTTEC_PAGE_PASSWORD: ${{ secrets.SWIFTTEC_PAGE_PASSWORD }}
          SWIFTTEC_VIDEO_SLOT: ${{ github.event.schedule == '0 0 7-13 9 *' && '0900' || github.event.schedule == '0 5 7-13 9 *' && '1400' || '' }}
        run: node scripts/render_forecast_videos_noaa_japan_h2_limited.mjs

      - name: Verify generated video
        run: |
          test -s docs/data/videos_noaa_japan_h2_limited_202609/latest/noaa_japan_horizontal_error.mp4
          test -s docs/data/videos_noaa_japan_h2_limited_202609/index.json
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of json \
            docs/data/videos_noaa_japan_h2_limited_202609/latest/noaa_japan_horizontal_error.mp4
          cat docs/data/videos_noaa_japan_h2_limited_202609/index.json

      - name: Commit limited edition output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A docs/data/videos_noaa_japan_h2_limited_202609

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "data: update limited NOAA Japan H2 forecast"

          for attempt in 1 2 3 4; do
            git pull --rebase
            if git push; then
              echo "Push succeeded"
              exit 0
            fi
            sleep $((attempt * 8))
          done

          echo "Push failed after retries"
          exit 1
