name: Train Kp AI Corrector

on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train-kp-ai-corrector
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Train Kp model-rule AI corrector
        run: python scripts/train_kp_ai_corrector.py

      - name: Update lightweight 1-year Kp hit-rate archive
        env:
          SWIFTTEC_KP_HIT_KEEP_DAYS: "365"
          SWIFTTEC_KP_HIT_SCAN_DAYS: "10"
          SWIFTTEC_KP_ACTUAL_KEEP_DAYS: "60"
          SWIFTTEC_KP_HIT_THRESHOLD: "5"
        run: python scripts/update_kp_hit_archive_1y.py

      - name: Show generated AI files
        run: |
          echo "--- docs/data/ai ---"
          find docs/data/ai -maxdepth 1 -type f -print | sort || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/data/ai/kp_hit_archive_1y.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("Kp hit archive days:", d.get("days_retained"))
              print("Kp hit archive N:", d.get("sample_count"))
              print("Kp hit archive bytes:", p.stat().st_size)
          PY
          git status --short

      - name: Commit AI updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data/ai
          if git diff --cached --quiet; then
            echo "No AI changes to commit"
          else
            git commit -m "data: update Kp AI and lightweight 1-year hit archive"
            git pull --rebase
            git push
          fi
